[project]
name = "irun"
version = "1.0.4"
description = "Windows desktop virtual running with legacy and iOS 17+ backends"
requires-python = ">=3.12,<3.13"
license = "MPL-2.0"
dependencies = [
    "PySide6-Essentials==6.12.0",
    "geopy==2.4.1",
    "winotify==1.1.0",
    "pymobiledevice3==11.44.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
